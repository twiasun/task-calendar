<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务日历</title>
<style>
/* ========== 根变量 ========== */
:root{
  --font-ui: "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --font-input: "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --fs-scale: 1;
}

/* ========== 基础 ========== */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#eef1f5;
  color:#1f2937;
  font-family:var(--font-ui);
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* ========== 工具栏 ========== */
.toolbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #d8dfe8;
  padding:7px 14px;
  display:flex;
  flex-wrap:wrap;
  gap:6px 0;
  align-items:center;
  font-size:12px;
  max-height:150px;
  overflow-y:auto;
}
.tb-group{
  display:flex;
  flex-wrap:wrap;
  gap:6px 11px;
  align-items:center;
  padding:0 12px;
  border-right:1px solid #e8eef5;
}
.tb-group:last-child{border-right:none;padding-right:0;}
.tb-title{
  font-weight:700;
  color:#2b6cb0;
  font-size:11px;
  letter-spacing:.3px;
  white-space:nowrap;
}
.toolbar label{display:flex;align-items:center;gap:4px;color:#475569;white-space:nowrap;}
.toolbar input[type="month"],
.toolbar input[type="number"],
.toolbar input[type="text"],
.toolbar select{
  font:inherit;
  font-size:11.5px;
  padding:3px 6px;
  border:1px solid #cfd8e3;
  border-radius:6px;
  background:#fff;
  color:#1f2937;
}
.toolbar input[type="number"]{width:50px;}
.toolbar input[type="checkbox"]{width:14px;height:14px;accent-color:#2b6cb0;cursor:pointer;}
.toolbar button{
  font:inherit;
  font-size:12px;
  padding:4px 12px;
  border-radius:999px;
  border:1px solid #cfd8e3;
  background:#fff;
  color:#2b6cb0;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.toolbar button:hover{background:#f2f7fd;border-color:#a8c4e0;}
.toolbar button.primary{background:#2b6cb0;color:#fff;border-color:#2b6cb0;}
.toolbar button.primary:hover{background:#245a94;}
.toolbar button.danger{color:#b91c1c;border-color:#fecaca;}
.toolbar button.danger:hover{background:#fef2f2;}
/* 加粗 / 斜体按钮（v5 丢失，这里恢复） */
.toolbar button.fmt{
  width:32px;padding:4px 0;text-align:center;font-weight:700;
  border-radius:7px;
}
.toolbar button.fmt.italic{font-style:italic;font-weight:500;}
.toolbar .status{font-size:11px;color:#94a3b8;min-width:100px;text-align:right;}
.toolbar .status.dirty{color:#c2410c;font-weight:600;}
.toolbar .hint{font-size:10.5px;color:#b0bccb;}

/* ========== 容器 ========== */
#calendar{padding:16px 0;}

/* ========== 月份块 ========== */
.month-block{
  display:flex;
  flex-direction:column;
  gap:1.6mm;
}
.month-block.page{
  width:281mm;
  height:193mm;
  margin:8mm auto;
  padding:5mm 7mm;
  background:#fff;
  box-shadow:0 6px 24px rgba(15,23,42,.13);
  overflow:hidden;
}
.month-block.continuous{
  max-width:1400px;
  margin:0 auto 32px;
  padding:20px 24px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(15,23,42,.08);
}
.month-block.continuous .week{flex:0 0 auto;min-height:92px;}
.month-block.page .week{flex:1 1 0;min-height:0;}

/* ========== 页眉 ========== */
.hd{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:1.4pt solid #1f2937;
  padding-bottom:1.4mm;
}
.hd h1{font-size:calc(15pt * var(--fs-scale));margin:0;font-weight:800;letter-spacing:.5px;}
.hd h1 span{font-size:calc(9pt * var(--fs-scale));font-weight:500;color:#94a3b8;margin-left:2mm;letter-spacing:0;}
.hd .sub{font-size:calc(6.5pt * var(--fs-scale));color:#94a3b8;letter-spacing:.5px;}

/* ========== 月度任务 ========== */
.month{
  border:1pt solid #c3d4e8;
  border-radius:1.6mm;
  background:linear-gradient(180deg,#f5f9fe 0%,#fff 60%);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.month.fixed{flex:0 0 26mm;height:26mm;}
.month.dynamic{flex:0 0 auto;}
.month-block.continuous .month{margin-bottom:2mm;}

.month-body{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  gap:1.6mm;
}
.month.fixed .month-body{min-height:0;}
.month.fixed .month-body .area{height:100%;min-height:0;}

/* 分栏竖线 */
.month-body.show-lines .area:not(:first-child){
  border-left:1px solid #c3d4e8;
}

/* ========== 按月设置条 ========== */
.month-settings{
  display:flex;
  flex-wrap:wrap;
  gap:4px 9px;
  align-items:center;
  padding:3px 8px;
  background:#f8fbff;
  border-bottom:.5pt solid #dbe6f3;
  font-size:10px;
  color:#475569;
}
.month-settings .ms-label{
  font-weight:700;
  color:#2b6cb0;
  font-size:10px;
  white-space:nowrap;
  letter-spacing:.2px;
}
.month-settings label{
  display:flex;
  align-items:center;
  gap:3px;
  white-space:nowrap;
}
.month-settings select,
.month-settings input[type="number"]{
  font:inherit;
  font-size:10px;
  padding:1px 4px;
  border:1px solid #cfd8e3;
  border-radius:4px;
  background:#fff;
  height:18px;
  box-sizing:border-box;
  color:#1f2937;
}
.month-settings input[type="number"]{width:36px;}
.month-settings input[type="checkbox"]{
  width:12px;height:12px;accent-color:#2b6cb0;cursor:pointer;
}
.month-settings button{
  font:inherit;
  font-size:10px;
  padding:2px 8px;
  border-radius:999px;
  border:1px solid #cfd8e3;
  background:#fff;
  color:#2b6cb0;
  cursor:pointer;
  height:18px;
  box-sizing:border-box;
  margin-left:auto;
}
.month-settings button:hover{background:#eef6ff;}

/* ========== 输入区（contenteditable） ========== */
.area{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  font-family:var(--font-input);
  font-size:calc(6.5pt * var(--fs-scale));
  line-height:calc(4.3mm * var(--fs-scale));
  padding:0 1.6mm;
  color:inherit;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(4.1mm * var(--fs-scale)),
    #e3ecf6 calc(4.1mm * var(--fs-scale)),
    #e3ecf6 calc(4.3mm * var(--fs-scale))
  );
  background-attachment:local;
  cursor:text;
  min-height:calc(4.3mm * var(--fs-scale));
  box-sizing:border-box;
  border-radius:0 0 1.2mm 1.2mm;
}
.area.bg-blank{background-image:none;}
.area:focus{background-color:#fbfdff;box-shadow:inset 0 0 0 1px #bfd7f2;}
.area::-webkit-scrollbar{width:4px;}
.area::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px;}
.area::-webkit-scrollbar-track{background:transparent;}
.area b,.area strong{font-weight:700;}
.area i,.area em{font-style:italic;}
.area span{font-size:inherit;}
.area span[style*="font-size"]{line-height:1.35;}

/* 每日 / 每周 输入区 */
.day .area,
.weektask .area{
  padding:0 1.4mm;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(4.1mm * var(--fs-scale)),
    #e9eff5 calc(4.1mm * var(--fs-scale)),
    #e9eff5 calc(4.3mm * var(--fs-scale))
  );
}

/* ========== 星期表头 ========== */
.dow{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(7,1fr) 46mm;
  gap:1.4mm;
  font-size:calc(6.5pt * var(--fs-scale));
  color:#94a3b8;
  text-align:center;
  letter-spacing:1px;
}
.dow i{font-style:normal;}
.dow i:last-child{text-align:left;padding-left:2mm;letter-spacing:0;}

/* ========== 周行 ========== */
.week{
  display:grid;
  grid-template-columns:repeat(7,1fr) 46mm;
  gap:1.4mm;
}

/* ========== 单日 ========== */
.day{
  border:.6pt solid #d8dfe8;
  border-radius:1.4mm;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.d-head{
  flex:0 0 auto;
  display:flex;
  align-items:baseline;
  gap:1.2mm;
  padding:.9mm 1.4mm .7mm;
  border-bottom:.5pt solid #e8eef5;
}
.d-num{font-size:calc(7.5pt * var(--fs-scale));font-weight:800;letter-spacing:.2px;}
.d-dow{font-size:calc(5.6pt * var(--fs-scale));color:#a8b3c2;letter-spacing:0;}
.day.wknd{background:#fdfaf8;}
.day.wknd .d-num{color:#c2410c;}
.day.off{background:#f4f6f9;}
.day.off .d-num{color:#b6c0cc;}
.day.off .d-dow{color:#c6cfda;}
.day.today{box-shadow:inset 0 0 0 1.5px #2b6cb0;}
.day.today .d-num{color:#2b6cb0;}

/* ========== 每周任务 ========== */
.weektask{
  border:.6pt solid #c3d4e8;
  border-radius:1.4mm;
  background:linear-gradient(180deg,#f5f9fe 0%,#fff 55%);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.w-head{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:.9mm 1.6mm .7mm;
  border-bottom:.5pt solid #dbe6f3;
  font-size:calc(7pt * var(--fs-scale));
  font-weight:800;
  color:#2b6cb0;
}
.w-head small{font-size:calc(5.6pt * var(--fs-scale));font-weight:400;color:#9fb0c4;}

/* ========== 空状态 ========== */
.empty-tip{
  text-align:center;
  color:#94a3b8;
  font-size:14px;
  padding:60px 20px;
}

/* ========== 打印 ========== */
@page{size:A4 landscape;margin:8mm;}

@media print{
  html,body{background:#fff;}
  .noprint{display:none !important;}
  #calendar{padding:0;}
  .month-block.page{
    width:281mm;
    height:193mm;
    margin:0;
    padding:5mm 7mm;
    box-shadow:none;
    page-break-after:always;
    break-after:page;
  }
  .month-block.page:last-child{page-break-after:auto;break-after:auto;}
  .month-block.continuous{
    box-shadow:none;
    border-radius:0;
    padding:0;
    margin:0 0 10mm;
    max-width:100%;
  }
  .month-block.continuous .week{min-height:80px;}
  .area:focus{box-shadow:none;background-color:transparent;}
  .area::-webkit-scrollbar{display:none;}
}
</style>
</head>
<body>

<!-- ========== 工具栏 ========== -->
<div class="toolbar noprint">

  <!-- 视图 -->
  <div class="tb-group">
    <span class="tb-title">视图</span>
    <label>起始 <input type="month" id="startMonth"></label>
    <label>显示 <input type="number" id="numMonths" min="1" max="24" value="1"> 个月</label>
    <label><input type="checkbox" id="continuous"> 连续滚动</label>
    <label><input type="checkbox" id="mergeMode"> 合并周</label>
  </div>

  <!-- 月度目标（全局默认） -->
  <div class="tb-group">
    <span class="tb-title">月度目标</span>
    <label><input type="checkbox" id="monthlyCustom"> 按月自定义</label>
    <label>背景
      <select id="monthlyBg">
        <option value="lines">横线</option>
        <option value="blank">空白</option>
      </select>
    </label>
    <label>分栏
      <select id="monthlyLayout">
        <option value="single">单栏</option>
        <option value="equal">等分</option>
        <option value="ratio">非等分</option>
      </select>
    </label>
    <label id="equalCountWrap" style="display:none">等分数
      <input type="number" id="equalCount" min="1" max="6" value="2">
    </label>
    <label id="ratioWrap" style="display:none">比例
      <input type="number" id="ratioA" min="1" max="9" value="1">:
      <input type="number" id="ratioB" min="1" max="9" value="1">
    </label>
    <label id="showColLinesWrap" style="display:none">
      <input type="checkbox" id="showColLines"> 分栏竖线
    </label>
    <label><input type="checkbox" id="monthlyDynamicHeight" checked> 动态高度</label>
  </div>

  <!-- 每日 -->
  <div class="tb-group">
    <span class="tb-title">每日目标</span>
    <label><input type="checkbox" id="dailyDynamicHeight"> 动态高度</label>
  </div>

  <!-- 字体 -->
  <div class="tb-group">
    <span class="tb-title">字体</span>
    <label>范围
      <select id="fontScope">
        <option value="global">全局</option>
        <option value="ui">仅界面</option>
        <option value="input">仅输入</option>
      </select>
    </label>
    <label>中文
      <input type="text" id="fontCN" list="fontList" placeholder="默认" style="width:88px;">
    </label>
    <label>英文
      <input type="text" id="fontEN" list="fontList" placeholder="默认" style="width:88px;">
    </label>
    <label>字号
      <input type="number" id="fontScale" min="50" max="200" step="5" value="100" style="width:52px;">%
    </label>
    <label>局部字号
      <select id="localFontSizeSel">
        <option value="">选中文字…</option>
        <option value="4">很小 4pt</option>
        <option value="5">小 5pt</option>
        <option value="6.5">标准 6.5pt</option>
        <option value="8">大 8pt</option>
        <option value="10">特大 10pt</option>
        <option value="12">超大 12pt</option>
      </select>
    </label>
    <!-- 恢复：加粗 / 斜体 -->
    <button type="button" id="btnBold" class="fmt" title="加粗（选中文字后按 Ctrl+B）">B</button>
    <button type="button" id="btnItalic" class="fmt italic" title="斜体（选中文字后按 Ctrl+I）">I</button>
    <span class="hint">选中文字后 Ctrl+B / Ctrl+I</span>
  </div>

  <!-- 操作 -->
  <div class="tb-group">
    <button id="btnSave" class="primary">保存数据</button>
    <button id="btnClearSession">清空本次填写</button>
    <button id="btnClearAll" class="danger">清空全部</button>
    <button id="btnPrint">打印 / 导出 PDF</button>
    <span class="status" id="status"></span>
  </div>

</div>

<!-- 字体候选 -->
<datalist id="fontList">
  <option value="PingFang SC">苹方</option>
  <option value="Microsoft YaHei">微软雅黑</option>
  <option value="Microsoft JhengHei">微软正黑体</option>
  <option value="SimSun">宋体</option>
  <option value="SimHei">黑体</option>
  <option value="KaiTi">楷体</option>
  <option value="FangSong">仿宋</option>
  <option value="STSong">华文宋体</option>
  <option value="STKaiti">华文楷体</option>
  <option value="STHeiti">华文黑体</option>
  <option value="Noto Sans SC">Noto Sans SC</option>
  <option value="Noto Serif SC">Noto Serif SC</option>
  <option value="Source Han Sans SC">思源黑体</option>
  <option value="Source Han Serif SC">思源宋体</option>
  <option value="WenQuanYi Micro Hei">文泉驿微米黑</option>
  <option value="Arial">Arial</option>
  <option value="Helvetica">Helvetica</option>
  <option value="Georgia">Georgia</option>
  <option value="Times New Roman">Times New Roman</option>
  <option value="Courier New">Courier New</option>
  <option value="Consolas">Consolas</option>
  <option value="Verdana">Verdana</option>
  <option value="Tahoma">Tahoma</option>
</datalist>

<!-- ========== 日历容器 ========== -->
<div id="calendar"></div>

<script>
/* ============================================================
   常量
   ============================================================ */
const STORAGE_KEY = 'taskCalendar_v7';
const DOW_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];

const DEFAULT_STACK = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif';

const DEFAULT_LAYOUT = {
  mode: 'single',                  // single | equal | ratio
  equalCount: 2,
  ratioA: 1,
  ratioB: 1,
  bg: 'lines',                     // lines | blank
  monthlyCustom: false,            // 按月自定义
  monthlyDynamicHeight: true,      // 月度目标动态高度
  dailyDynamicHeight: false,       // 每日目标动态高度
  showColLines: false,             // 分栏竖线
  fontScope: 'global',             // global | ui | input
  fontCN: '',
  fontEN: '',
  fontScale: 100,
};

/* ============================================================
   状态
   ============================================================ */
const state = {
  startYear: 2026,
  startMonth: 12,
  monthsToShow: 1,
  continuous: false,
  mergeMode: false,
  data: { daily:{}, weekly:{}, monthly:{} },
  layout: Object.assign({}, DEFAULT_LAYOUT),
  monthlyOverrides: {},            // { '2026-12': { bg, mode, ... } }
  savedSnapshot: null,
  dirty: false,
};

/* ============================================================
   小工具
   ============================================================ */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2,'0');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function dateKey(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function monthKey(y, m) {
  return `${y}-${pad2(m)}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function startOfWeek(d) {
  const r = new Date(d);
  r.setHours(0,0,0,0);
  const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  r.setDate(r.getDate() + diff);
  return r;
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth()
    && a.getDate() === b.getDate();
}
function fmtShort(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

/* ============================================================
   按月自定义：有效配置
   ============================================================ */
function getEffectiveMonthlyLayout(mKey) {
  const g = state.layout;

  if (!g.monthlyCustom) {
    return {
      bg: g.bg,
      mode: g.mode,
      equalCount: g.equalCount,
      ratioA: g.ratioA,
      ratioB: g.ratioB,
      showColLines: g.showColLines,
      monthlyDynamicHeight: g.monthlyDynamicHeight,
    };
  }

  const o = state.monthlyOverrides[mKey] || {};
  const pick = k => (o[k] !== undefined ? o[k] : g[k]);
  return {
    bg: pick('bg'),
    mode: pick('mode'),
    equalCount: pick('equalCount'),
    ratioA: pick('ratioA'),
    ratioB: pick('ratioB'),
    showColLines: pick('showColLines'),
    monthlyDynamicHeight: pick('monthlyDynamicHeight'),
  };
}

function setMonthlyOverride(mKey, field, value) {
  if (!state.monthlyOverrides[mKey]) state.monthlyOverrides[mKey] = {};
  state.monthlyOverrides[mKey][field] = value;
}

function clearMonthlyOverride(mKey) {
  delete state.monthlyOverrides[mKey];
}

/* ============================================================
   分栏布局计算
   ============================================================ */
function getLayoutConfigFrom(cfg) {
  if (cfg.mode === 'equal') {
    const n = Math.max(1, Math.min(6, parseInt(cfg.equalCount, 10) || 2));
    return { cols: n, template: `repeat(${n}, 1fr)` };
  }
  if (cfg.mode === 'ratio') {
    const a = Math.max(1, Math.min(9, parseInt(cfg.ratioA, 10) || 1));
    const b = Math.max(1, Math.min(9, parseInt(cfg.ratioB, 10) || 1));
    return { cols: 2, template: `${a}fr ${b}fr` };
  }
  return { cols: 1, template: '1fr' };
}

/* ============================================================
   月度目标内容读写
   ============================================================ */
function getMonthlySlot(mKey, i) {
  const v = state.data.monthly[mKey];
  if (Array.isArray(v)) return v[i] || '';
  if (typeof v === 'string') return i === 0 ? v : '';
  return '';
}
function setMonthlySlot(mKey, i, val) {
  let arr = state.data.monthly[mKey];
  if (!Array.isArray(arr)) {
    const old = arr;
    arr = [];
    if (typeof old === 'string' && old) arr[0] = old;
    state.data.monthly[mKey] = arr;
  }
  arr[i] = val;
}

/* ============================================================
   持久化
   ============================================================ */
function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const layout = Object.assign({}, DEFAULT_LAYOUT, d.layout || {});
    if (d.layout && 'dynamicHeight' in d.layout && !('monthlyDynamicHeight' in d.layout)) {
      layout.monthlyDynamicHeight = !!d.layout.dynamicHeight;
    }
    return {
      daily:   d.daily   || {},
      weekly:  d.weekly  || {},
      monthly: d.monthly || {},
      layout:  layout,
      monthlyOverrides: d.monthlyOverrides || {},
    };
  } catch (e) {
    return null;
  }
}
function persistData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    daily:   state.data.daily,
    weekly:  state.data.weekly,
    monthly: state.data.monthly,
    layout:  state.layout,
    monthlyOverrides: state.monthlyOverrides,
  }));
}
function snapshot() {
  return JSON.stringify({
    data: state.data,
    layout: state.layout,
    monthlyOverrides: state.monthlyOverrides,
  });
}

/* ============================================================
   状态提示
   ============================================================ */
function markDirty() {
  state.dirty = true;
  updateStatus();
}
function updateStatus() {
  const s = $('#status');
  if (!s) return;
  if (state.dirty) {
    s.textContent = '● 有未保存的修改';
    s.className = 'status dirty';
  } else {
    s.textContent = '✓ 已保存';
    s.className = 'status';
  }
}

/* ============================================================
   字体应用
   ============================================================ */
function buildFontStack() {
  const L = state.layout;
  const parts = [];
  if (L.fontEN) parts.push(`"${L.fontEN.trim()}"`);
  if (L.fontCN) parts.push(`"${L.fontCN.trim()}"`);
  parts.push('"PingFang SC"','"Microsoft YaHei"','"Hiragino Sans GB"','"Noto Sans SC"','system-ui','-apple-system','sans-serif');
  return parts.join(',');
}

function applyFonts() {
  const L = state.layout;
  const root = document.documentElement;
  const stack = buildFontStack();
  const hasCustom = !!(L.fontCN || L.fontEN);

  if (!hasCustom) {
    root.style.setProperty('--font-ui', DEFAULT_STACK);
    root.style.setProperty('--font-input', DEFAULT_STACK);
  } else if (L.fontScope === 'ui') {
    root.style.setProperty('--font-ui', stack);
    root.style.setProperty('--font-input', DEFAULT_STACK);
  } else if (L.fontScope === 'input') {
    root.style.setProperty('--font-input', stack);
    root.style.setProperty('--font-ui', DEFAULT_STACK);
  } else {
    root.style.setProperty('--font-ui', stack);
    root.style.setProperty('--font-input', stack);
  }

  let scale = parseFloat(L.fontScale);
  if (!isFinite(scale)) scale = 100;
  scale = Math.max(50, Math.min(200, scale)) / 100;
  root.style.setProperty('--fs-scale', scale);
}

/* ============================================================
   周计算
   ============================================================ */
function getMonthWeeks(year, month, mergeMode) {
  const firstDay = new Date(year, month - 1, 1);
  const lastDay  = new Date(year, month, 0);

  const start         = startOfWeek(firstDay);
  const lastWeekStart = startOfWeek(lastDay);

  const weeks = [];
  let cur = new Date(start);

  while (cur <= lastWeekStart) {
    let daysInMonth = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(cur, i);
      if (d.getFullYear() === year && d.getMonth() === month - 1) daysInMonth++;
    }
    weeks.push({ start: new Date(cur), daysInMonth });
    cur = addDays(cur, 7);
  }

  if (mergeMode) return weeks.filter(w => w.daysInMonth >= 4);
  return weeks;
}

/* ============================================================
   输入区
   ============================================================ */
function readEditable(elm) {
  const txt = (elm.textContent || '').replace(/\u200B/g, '').trim();
  if (!txt) return '';
  return elm.innerHTML;
}

function makeArea(value, key, type, onInput) {
  const elm = document.createElement('div');
  elm.className = 'area';
  elm.setAttribute('contenteditable', 'true');
  elm.spellcheck = false;
  elm.dataset.key = key;
  elm.dataset.type = type;
  if (value) elm.innerHTML = value;

  elm.addEventListener('input', () => {
    onInput(readEditable(elm));
    markDirty();
    syncSameKey(key, elm.innerHTML, elm);
    if (type === 'monthly') fitMonthlyHeights();
    if (type === 'daily' && state.layout.dailyDynamicHeight) fitDailyHeights();
  });

  elm.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.execCommand('insertLineBreak');
    }
  });

  elm.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  return elm;
}

function syncSameKey(key, html, excludeEl) {
  document.querySelectorAll(`[data-key="${key}"]`).forEach(e => {
    if (e !== excludeEl && e.innerHTML !== html) e.innerHTML = html;
  });
}

/* ============================================================
   动态高度：月度目标（1–3 行）
   ============================================================ */
function fitMonthlyHeights() {
  document.querySelectorAll('.month.dynamic').forEach(box => {
    const areas = box.querySelectorAll('.month-body .area');
    if (!areas.length) return;

    let maxH = 0;

    areas.forEach(ta => {
      const cs   = getComputedStyle(ta);
      const lh   = parseFloat(cs.lineHeight) || 16;
      const padT = parseFloat(cs.paddingTop) || 0;
      const padB = parseFloat(cs.paddingBottom) || 0;

      const prevH  = ta.style.height;
      const prevOv = ta.style.overflow;

      ta.style.height   = '0px';
      ta.style.overflow = 'hidden';
      const sh = ta.scrollHeight;
      ta.style.height   = prevH;
      ta.style.overflow = prevOv;

      const textH = Math.max(0, sh - padT - padB);
      let lines = Math.round(textH / lh);
      if (!isFinite(lines) || lines < 1) lines = 1;
      if (lines > 3) lines = 3;

      const h = lines * lh + padT + padB;
      if (h > maxH) maxH = h;
    });

    areas.forEach(ta => { ta.style.height = maxH + 'px'; });
  });
}

/* ============================================================
   动态高度：每日目标（1–3 行，每周统一）
   ============================================================ */
function fitDailyHeights() {
  document.querySelectorAll('.week').forEach(weekRow => {
    const areas = weekRow.querySelectorAll('.day .area');
    if (!areas.length) return;

    let maxLines = 1;

    areas.forEach(ta => {
      const cs   = getComputedStyle(ta);
      const lh   = parseFloat(cs.lineHeight) || 16;
      const padT = parseFloat(cs.paddingTop) || 0;
      const padB = parseFloat(cs.paddingBottom) || 0;

      const prevH  = ta.style.height;
      const prevOv = ta.style.overflow;

      ta.style.height   = '0px';
      ta.style.overflow = 'hidden';
      const sh = ta.scrollHeight;
      ta.style.height   = prevH;
      ta.style.overflow = prevOv;

      const textH = Math.max(0, sh - padT - padB);
      let lines = Math.round(textH / lh);
      if (!isFinite(lines) || lines < 1) lines = 1;
      if (lines > 3) lines = 3;
      if (lines > maxLines) maxLines = lines;
    });

    areas.forEach(ta => {
      const cs   = getComputedStyle(ta);
      const lh   = parseFloat(cs.lineHeight) || 16;
      const padT = parseFloat(ta.paddingTop) || 0;
      const padB = parseFloat(ta.paddingBottom) || 0;
      ta.style.height = (maxLines * lh + padT + padB) + 'px';
    });
  });
}

function clearDailyHeights() {
  document.querySelectorAll('.day .area').forEach(ta => {
    ta.style.height = '';
  });
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  const container = $('#calendar');
  container.innerHTML = '';

  if (state.monthsToShow < 1) {
    container.innerHTML = '<div class="empty-tip">请选择要显示的月份数量</div>';
    return;
  }

  for (let i = 0; i < state.monthsToShow; i++) {
    const d = new Date(state.startYear, state.startMonth - 1 + i, 1);
    container.appendChild(renderMonth(d.getFullYear(), d.getMonth() + 1));
  }

  fitMonthlyHeights();
  if (state.layout.dailyDynamicHeight) fitDailyHeights();
  updateStatus();
}

function renderMonth(year, month) {
  const mKey  = monthKey(year, month);
  const block = el('div', 'month-block ' + (state.continuous ? 'continuous' : 'page'));
  block.dataset.mkey = mKey;

  /* 页眉 */
  const hd = el('div', 'hd');
  const h1 = el('h1', null, `${year} 年 ${month} 月`);
  h1.appendChild(el('span', null, '任务日历'));
  hd.appendChild(h1);
  hd.appendChild(el('div', 'sub', '每日任务 · 每周任务 · 每月任务'));
  block.appendChild(hd);

  /* 月度目标 */
  block.appendChild(renderMonthBox(year, month));

  /* 星期表头 */
  const dow = el('div', 'dow');
  DOW_NAMES.forEach(n => dow.appendChild(el('i', null, n)));
  dow.appendChild(el('i', null, '本周任务'));
  block.appendChild(dow);

  /* 周行 */
  const weeks = getMonthWeeks(year, month, state.mergeMode);
  if (weeks.length === 0) {
    block.appendChild(el('div', 'empty-tip', '本月没有符合条件的周'));
  } else {
    weeks.forEach(w => block.appendChild(renderWeek(w.start, year, month)));
  }

  return block;
}

function renderMonthBox(year, month) {
  const mKey    = monthKey(year, month);
  const custom  = state.layout.monthlyCustom;
  const eff     = getEffectiveMonthlyLayout(mKey);
  const layoutCfg = getLayoutConfigFrom(eff);

  const box = el('div', 'month ' + (eff.monthlyDynamicHeight ? 'dynamic' : 'fixed'));
  box.dataset.mkey = mKey;

  /* 头部 */
  const head = el('div', 'w-head');
  const title = custom
    ? `${year} 年 ${month} 月 · 月度目标`
    : '本月任务 / 月度目标';
  head.appendChild(el('span', null, title));
  head.appendChild(el('small', null, 'MONTHLY'));
  box.appendChild(head);

  /* 按月设置条 */
  if (custom) {
    box.appendChild(renderMonthlySettingsBar(year, month, mKey, eff));
  }

  /* 内容 */
  const body = el('div', 'month-body');
  body.style.gridTemplateColumns = layoutCfg.template;

  if (eff.showColLines && layoutCfg.cols > 1) {
    body.classList.add('show-lines');
  }

  for (let i = 0; i < layoutCfg.cols; i++) {
    const key = `${mKey}#${i}`;
    const ta  = makeArea(
      getMonthlySlot(mKey, i),
      key,
      'monthly',
      v => setMonthlySlot(mKey, i, v)
    );
    if (eff.bg === 'blank') ta.classList.add('bg-blank');
    body.appendChild(ta);
  }

  box.appendChild(body);
  return box;
}

/* ============================================================
   按月设置条
   ============================================================ */
function renderMonthlySettingsBar(year, month, mKey, eff) {
  const bar = el('div', 'month-settings noprint');
  bar.dataset.mkey = mKey;

  /* 年月标签 */
  bar.appendChild(el('span', 'ms-label', `${year}年${month}月`));

  /* 背景 */
  {
    const lb = el('label');
    lb.appendChild(document.createTextNode('背景'));
    const sel = document.createElement('select');
    sel.dataset.field = 'bg';
    sel.innerHTML = '<option value="lines">横线</option><option value="blank">空白</option>';
    sel.value = eff.bg;
    lb.appendChild(sel);
    bar.appendChild(lb);
  }

  /* 分栏 */
  {
    const lb = el('label');
    lb.appendChild(document.createTextNode('分栏'));
    const sel = document.createElement('select');
    sel.dataset.field = 'mode';
    sel.innerHTML = '<option value="single">单栏</option><option value="equal">等分</option><option value="ratio">非等分</option>';
    sel.value = eff.mode;
    lb.appendChild(sel);
    bar.appendChild(lb);
  }

  /* 等分数 */
  if (eff.mode === 'equal') {
    const lb = el('label');
    lb.appendChild(document.createTextNode('等分数'));
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = '1'; inp.max = '6';
    inp.value = eff.equalCount;
    inp.dataset.field = 'equalCount';
    lb.appendChild(inp);
    bar.appendChild(lb);
  }

  /* 比例 */
  if (eff.mode === 'ratio') {
    const lb = el('label');
    lb.appendChild(document.createTextNode('比例'));
    const a = document.createElement('input');
    a.type = 'number'; a.min = '1'; a.max = '9';
    a.value = eff.ratioA; a.dataset.field = 'ratioA';
    const sep = document.createElement('span'); sep.textContent = ':';
    const b = document.createElement('input');
    b.type = 'number'; b.min = '1'; b.max = '9';
    b.value = eff.ratioB; b.dataset.field = 'ratioB';
    lb.appendChild(a);
    lb.appendChild(sep);
    lb.appendChild(b);
    bar.appendChild(lb);
  }

  /* 竖线 */
  if (eff.mode !== 'single') {
    const lb = el('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!eff.showColLines;
    cb.dataset.field = 'showColLines';
    lb.appendChild(cb);
    lb.appendChild(document.createTextNode('竖线'));
    bar.appendChild(lb);
  }

  /* 动态高度 */
  {
    const lb = el('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!eff.monthlyDynamicHeight;
    cb.dataset.field = 'monthlyDynamicHeight';
    lb.appendChild(cb);
    lb.appendChild(document.createTextNode('动态高度'));
    bar.appendChild(lb);
  }

  /* 重置 */
  const resetBtn = el('button', null, '重置');
  resetBtn.type = 'button';
  resetBtn.dataset.action = 'reset';
  bar.appendChild(resetBtn);

  return bar;
}

function renderWeek(weekStart, year, month) {
  const row = el('div', 'week');

  for (let i = 0; i < 7; i++) {
    row.appendChild(renderDay(addDays(weekStart, i), year, month));
  }

  /* 每周任务 */
  const wKey = dateKey(weekStart);
  const wt   = el('div', 'weektask');

  const wh = el('div', 'w-head');
  wh.appendChild(el('span', null, '本周任务'));
  wh.appendChild(el('small', null, `${fmtShort(weekStart)} – ${fmtShort(addDays(weekStart, 6))}`));
  wt.appendChild(wh);

  wt.appendChild(makeArea(
    state.data.weekly[wKey] || '',
    wKey,
    'weekly',
    v => { state.data.weekly[wKey] = v; }
  ));

  row.appendChild(wt);
  return row;
}

function renderDay(date, year, month) {
  const isOther   = date.getMonth() !== month - 1 || date.getFullYear() !== year;
  const isWeekend = date.getDay() === 0 || date.getDay() === 6;
  const isToday   = isSameDay(date, new Date());

  const cell = el('div', 'day');
  if (isWeekend) cell.classList.add('wknd');
  if (isOther)   cell.classList.add('off');
  if (isToday)   cell.classList.add('today');

  const head = el('div', 'd-head');
  head.appendChild(el('span', 'd-num', `${date.getMonth()+1}/${date.getDate()}`));
  head.appendChild(el('span', 'd-dow', DOW_NAMES[(date.getDay()+6)%7]));
  cell.appendChild(head);

  const k = dateKey(date);
  cell.appendChild(makeArea(
    state.data.daily[k] || '',
    k,
    'daily',
    v => { state.data.daily[k] = v; }
  ));

  return cell;
}

/* ============================================================
   局部重渲染某个
   ============================================================ */
function rerenderMonth(mKey) {
  const [y, m] = mKey.split('-').map(Number);
  const old = document.querySelector(`.month-block[data-mkey="${mKey}"]`);
  if (!old) return;
  const fresh = renderMonth(y, m);
  old.replaceWith(fresh);
  fitMonthlyHeights();
  if (state.layout.dailyDynamicHeight) fitDailyHeights();
}

/* ============================================================
   局部字号（选中文本）
   ============================================================ */
function applyLocalFontSize(pt) {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) {
    alert('请先选中要设置的文字，再选择字号。');
    return;
  }

  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentNode;

  const area = node.closest ? node.closest('.area') : null;
  if (!area) {
    alert('请先在输入区域内选中文字。');
    return;
  }

  try {
    const frag = range.extractContents();
    const span = document.createElement('span');
    span.style.fontSize = pt + 'pt';
    span.appendChild(frag);
    range.insertNode(span);

    sel.removeAllRanges();
    const nr = document.createRange();
    nr.selectNodeContents(span);
    sel.addRange(nr);

    area.dispatchEvent(new Event('input', { bubbles: true }));
  } catch (e) {
    console.error(e);
    alert('该选区结构较复杂，请尝试重新选中后再试。');
  }
}

/* ============================================================
   加粗 / 斜体：同步数据
   —— 修复：v5 丢失了这个函数，导致按钮/快捷键后数据不落库
   ============================================================ */
function triggerAreaInput() {
  /* 1) 焦点在 .area 上，直接派发 */
  const active = document.activeElement;
  if (active && active.classList && active.classList.contains('area')) {
    active.dispatchEvent(new Event('input', { bubbles: true }));
    return;
  }
  /* 2) 焦点不在（例如点了工具栏按钮），用当前选区定位 */
  const sel = window.getSelection();
  if (sel && sel.rangeCount) {
    let node = sel.getRangeAt(0).commonAncestorContainer;
    if (node.nodeType === 3) node = node.parentNode;
    const area = node.closest ? node.closest('.area') : null;
    if (area) area.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

/* ============================================================
   保存 / 清空
   ============================================================ */
function doSave() {
  persistData();
  state.savedSnapshot = snapshot();
  state.dirty = false;
  updateStatus();

  const btn = $('#btnSave');
  const old = btn.textContent;
  btn.textContent = '✓ 已保存';
  setTimeout(() => { btn.textContent = old; }, 1200);
}

function clearSession() {
  if (state.dirty) {
    if (!confirm('确定要丢弃未保存的修改，恢复到上次保存的状态吗？')) return;
  }
  if (state.savedSnapshot) {
    const s = JSON.parse(state.savedSnapshot);
    state.data   = s.data;
    state.layout = s.layout;
    state.monthlyOverrides = s.monthlyOverrides || {};
    syncLayoutControls();
    applyFonts();
  } else {
    state.data = { daily:{}, weekly:{}, monthly:{} };
  }
  state.dirty = false;
  render();
  updateStatus();
}

function clearAll() {
  if (!confirm('确定要清空全部填写内容吗？\n\n此操作会删除浏览器中保存的所有任务数据，且不可恢复。')) return;
  state.data = { daily:{}, weekly:{}, monthly:{} };
  state.monthlyOverrides = {};
  localStorage.removeItem(STORAGE_KEY);
  state.savedSnapshot = snapshot();
  state.dirty = false;
  render();
  updateStatus();
}

/* ============================================================
   控件同步
   ============================================================ */
function syncLayoutControls() {
  const L = state.layout;

  $('#monthlyCustom').checked       = L.monthlyCustom;
  $('#monthlyBg').value             = L.bg;
  $('#monthlyLayout').value         = L.mode;
  $('#equalCount').value            = L.equalCount;
  $('#ratioA').value                = L.ratioA;
  $('#ratioB').value                = L.ratioB;
  $('#monthlyDynamicHeight').checked = L.monthlyDynamicHeight;
  $('#dailyDynamicHeight').checked   = L.dailyDynamicHeight;
  $('#showColLines').checked         = L.showColLines;

  $('#fontScope').value = L.fontScope;
  $('#fontCN').value    = L.fontCN || '';
  $('#fontEN').value    = L.fontEN || '';
  $('#fontScale').value = L.fontScale;

  const isMulti = L.mode !== 'single';
  $('#equalCountWrap').style.display   = L.mode === 'equal' ? '' : 'none';
  $('#ratioWrap').style.display        = L.mode === 'ratio' ? '' : 'none';
  $('#showColLinesWrap').style.display = isMulti ? '' : 'none';
}

/* ============================================================
   事件
   ============================================================ */
function bindEvents() {

  /* 起始月份 */
  $('#startMonth').addEventListener('change', e => {
    const v = e.target.value;
    if (!v) return;
    const [y, m] = v.split('-').map(Number);
    state.startYear  = y;
    state.startMonth = m;
    render();
  });

  /* 显示月数 */
  $('#numMonths').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 1;
    n = Math.max(1, Math.min(24, n));
    e.target.value = n;
    state.monthsToShow = n;
    render();
  });

  /* 连续滚动 */
  $('#continuous').addEventListener('change', e => {
    state.continuous = e.target.checked;
    render();
  });

  /* 合并周 */
  $('#mergeMode').addEventListener('change', e => {
    state.mergeMode = e.target.checked;
    render();
  });

  /* 按月自定义 */
  $('#monthlyCustom').addEventListener('change', e => {
    state.layout.monthlyCustom = e.target.checked;
    markDirty();
    render();
  });

  /* 月度背景 */
  $('#monthlyBg').addEventListener('change', e => {
    state.layout.bg = e.target.value;
    markDirty();
    render();
  });

  /* 分栏 */
  $('#monthlyLayout').addEventListener('change', e => {
    state.layout.mode = e.target.value;
    syncLayoutControls();
    markDirty();
    render();
  });
  $('#equalCount').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 2;
    n = Math.max(1, Math.min(6, n));
    e.target.value = n;
    state.layout.equalCount = n;
    markDirty();
    render();
  });
  $('#ratioA').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 1;
    n = Math.max(1, Math.min(9, n));
    e.target.value = n;
    state.layout.ratioA = n;
    markDirty();
    render();
  });
  $('#ratioB').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 1;
    n = Math.max(1, Math.min(9, n));
    e.target.value = n;
    state.layout.ratioB = n;
    markDirty();
    render();
  });

  /* 动态高度 */
  $('#monthlyDynamicHeight').addEventListener('change', e => {
    state.layout.monthlyDynamicHeight = e.target.checked;
    markDirty();
    render();
  });
  $('#dailyDynamicHeight').addEventListener('change', e => {
    state.layout.dailyDynamicHeight = e.target.checked;
    markDirty();
    if (state.layout.dailyDynamicHeight) {
      fitDailyHeights();
    } else {
      clearDailyHeights();
    }
  });

  /* 分栏竖线 */
  $('#showColLines').addEventListener('change', e => {
    state.layout.showColLines = e.target.checked;
    markDirty();
    render();
  });

  /* 字体 */
  $('#fontScope').addEventListener('change', e => {
    state.layout.fontScope = e.target.value;
    applyFonts();
    markDirty();
  });
  $('#fontCN').addEventListener('input', e => {
    state.layout.fontCN = e.target.value;
    applyFonts();
    markDirty();
    fitMonthlyHeights();
    if (state.layout.dailyDynamicHeight) fitDailyHeights();
  });
  $('#fontEN').addEventListener('input', e => {
    state.layout.fontEN = e.target.value;
    applyFonts();
    markDirty();
    fitMonthlyHeights();
    if (state.layout.dailyDynamicHeight) fitDailyHeights();
  });
  $('#fontScale').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 100;
    n = Math.max(50, Math.min(200, n));
    e.target.value = n;
    state.layout.fontScale = n;
    applyFonts();
    markDirty();
    setTimeout(() => {
      fitMonthlyHeights();
      if (state.layout.dailyDynamicHeight) fitDailyHeights();
    }, 30);
  });

  /* 局部字号 */
  $('#localFontSizeSel').addEventListener('change', e => {
    const v = e.target.value;
    if (!v) return;
    applyLocalFontSize(v);
    e.target.value = '';
  });

  /* ===== 加粗 / 斜体按钮（恢复） ===== */
  $('#btnBold').addEventListener('mousedown', e => {
    e.preventDefault();                 // 保住选区，避免焦点被按钮抢走
    document.execCommand('bold');
    triggerAreaInput();
  });
  $('#btnItalic').addEventListener('mousedown', e => {
    e.preventDefault();
    document.execCommand('italic');
    triggerAreaInput();
  });

  /* 快捷键 Ctrl+B / Ctrl+I：浏览器默认已执行，这里补一次 input 同步 */
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = (e.key || '').toLowerCase();
    if (k !== 'b' && k !== 'i') return;
    const active = document.activeElement;
    if (active && active.classList && active.classList.contains('area')) {
      setTimeout(triggerAreaInput, 0);
    }
  });

  /* 操作按钮 */
  $('#btnSave').addEventListener('click', doSave);
  $('#btnClearSession').addEventListener('click', clearSession);
  $('#btnClearAll').addEventListener('click', clearAll);
  $('#btnPrint').addEventListener('click', () => window.print());

  /* ===== 按月设置条：统一委托 ===== */
  document.addEventListener('change', e => {
    const bar = e.target.closest && e.target.closest('.month-settings');
    if (!bar) return;
    const mKey  = bar.dataset.mkey;
    const field = e.target.dataset.field;
    if (!field) return;

    let value;
    if (e.target.type === 'checkbox') {
      value = e.target.checked;
    } else if (e.target.type === 'number') {
      value = parseInt(e.target.value, 10);
      if (isNaN(value)) value = 1;
      if (field === 'equalCount') value = Math.max(1, Math.min(6, value));
      if (field === 'ratioA' || field === 'ratioB') value = Math.max(1, Math.min(9, value));
    } else {
      value = e.target.value;
    }

    setMonthlyOverride(mKey, field, value);
    markDirty();
    rerenderMonth(mKey);
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest && e.target.closest('.month-settings button[data-action="reset"]');
    if (!btn) return;
    const bar = btn.closest('.month-settings');
    const mKey = bar.dataset.mkey;
    clearMonthlyOverride(mKey);
    markDirty();
    rerenderMonth(mKey);
  });

  /* Ctrl / Cmd + S */
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      doSave();
    }
  });

  /* 离开前提醒 */
  window.addEventListener('beforeunload', e => {
    if (state.dirty) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* 窗口尺寸变化 */
  let rzT = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      fitMonthlyHeights();
      if (state.layout.dailyDynamicHeight) fitDailyHeights();
    }, 120);
  });

  /* 打印前重算高度 */
  window.addEventListener('beforeprint', () => {
    fitMonthlyHeights();
    if (state.layout.dailyDynamicHeight) fitDailyHeights();
  });
}

/* ============================================================
   初始化
   ============================================================ */
function init() {
  const saved = loadAll();

  if (saved) {
    state.data   = { daily: saved.daily, weekly: saved.weekly, monthly: saved.monthly };
    state.layout = saved.layout;
    state.monthlyOverrides = saved.monthlyOverrides || {};
  }

  state.savedSnapshot = snapshot();
  state.dirty = false;

  /* 默认显示当前月 */
  const now = new Date();
  state.startYear  = now.getFullYear();
  state.startMonth = now.getMonth() + 1;
  $('#startMonth').value = `${state.startYear}-${pad2(state.startMonth)}`;
  $('#numMonths').value  = 1;

  syncLayoutControls();
  applyFonts();
  bindEvents();
  render();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      fitMonthlyHeights();
      if (state.layout.dailyDynamicHeight) fitDailyHeights();
    });
  }
  window.addEventListener('load', () => {
    fitMonthlyHeights();
    if (state.layout.dailyDynamicHeight) fitDailyHeights();
  });
}

init();
</script>
</body>
</html>
