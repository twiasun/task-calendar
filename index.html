<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务日历</title>
<style>
/* ========== 基础 ========== */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#eef1f5;
  color:#1f2937;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* ========== 工具栏 ========== */
.toolbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #d8dfe8;
  padding:9px 16px;
  display:flex;
  flex-wrap:wrap;
  gap:8px 20px;
  align-items:center;
  font-size:13px;
}
.tb-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px 12px;
  align-items:center;
}
.tb-title{
  font-weight:700;
  color:#2b6cb0;
  font-size:12px;
  letter-spacing:.3px;
}
.toolbar label{display:flex;align-items:center;gap:5px;color:#475569;white-space:nowrap;}
.toolbar input[type="month"],
.toolbar input[type="number"],
.toolbar select{
  font:inherit;
  padding:4px 8px;
  border:1px solid #cfd8e3;
  border-radius:6px;
  background:#fff;
  color:#1f2937;
}
.toolbar input[type="number"]{width:56px;}
.toolbar input[type="checkbox"]{width:15px;height:15px;accent-color:#2b6cb0;cursor:pointer;}
.toolbar button{
  font:inherit;
  padding:6px 14px;
  border-radius:999px;
  border:1px solid #cfd8e3;
  background:#fff;
  color:#2b6cb0;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.toolbar button:hover{background:#f2f7fd;border-color:#a8c4e0;}
.toolbar button.primary{background:#2b6cb0;color:#fff;border-color:#2b6cb0;}
.toolbar button.primary:hover{background:#245a94;}
.toolbar button.danger{color:#b91c1c;border-color:#fecaca;}
.toolbar button.danger:hover{background:#fef2f2;}
.toolbar .status{font-size:12px;color:#94a3b8;margin-left:auto;min-width:110px;text-align:right;}
.toolbar .status.dirty{color:#c2410c;font-weight:600;}

/* ========== 容器 ========== */
#calendar{padding:16px 0;}

/* ========== 月份块 ========== */
.month-block{
  display:flex;
  flex-direction:column;
  gap:1.6mm;
}
.month-block.page{
  width:281mm;
  height:193mm;
  margin:8mm auto;
  padding:5mm 7mm;
  background:#fff;
  box-shadow:0 6px 24px rgba(15,23,42,.13);
  overflow:hidden;
}
.month-block.continuous{
  max-width:1400px;
  margin:0 auto 32px;
  padding:20px 24px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(15,23,42,.08);
}
.month-block.continuous .week{flex:0 0 auto;height:92px;}
.month-block.page .week{flex:1 1 0;min-height:0;}

/* ========== 页眉 ========== */
.hd{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:1.4pt solid #1f2937;
  padding-bottom:1.4mm;
}
.hd h1{font-size:15pt;margin:0;font-weight:800;letter-spacing:.5px;}
.hd h1 span{font-size:9pt;font-weight:500;color:#94a3b8;margin-left:2mm;letter-spacing:0;}
.hd .sub{font-size:6.5pt;color:#94a3b8;letter-spacing:.5px;}

/* ========== 月度任务（动态高度） ========== */
.month{
  flex:0 0 auto;
  border:1pt solid #c3d4e8;
  border-radius:1.6mm;
  background:linear-gradient(180deg,#f5f9fe 0%,#fff 60%);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.month-block.continuous .month{margin-bottom:2mm;}

.month-body{
  display:grid;
  gap:1.6mm;
  padding:0;
  flex:1 1 auto;
  min-height:0;
  align-items:start;
}

/* 月度区输入框：由 JS 统一设定高度 */
.month-body .area{
  flex:none;
  width:100%;
  min-height:0;
  padding:0 1.6mm;
  font-size:6.5pt;
  line-height:4.3mm;
  overflow:auto;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 4.1mm,
    #e3ecf6 4.1mm,
    #e3ecf6 4.3mm
  );
  background-attachment:local;
  border-radius:0 0 1.2mm 1.2mm;
}
.month-body .area.bg-blank{background-image:none;}
.month-body .area:focus{background-color:#fbfdff;}

/* ========== 通用输入区 ========== */
.area{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  border:none;
  outline:none;
  resize:none;
  background:transparent;
  font-family:inherit;
  font-size:6.5pt;
  line-height:4.3mm;
  padding:0 1.4mm;
  color:inherit;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 4.1mm,
    #e9eff5 4.1mm,
    #e9eff5 4.3mm
  );
  background-attachment:local;
}
.area:focus{background-color:#fbfdff;box-shadow:inset 0 0 0 1px #bfd7f2;}
.area::-webkit-scrollbar{width:4px;}
.area::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px;}
.area::-webkit-scrollbar-track{background:transparent;}

/* ========== 星期表头 ========== */
.dow{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(7,1fr) 46mm;
  gap:1.4mm;
  font-size:6.5pt;
  color:#94a3b8;
  text-align:center;
  letter-spacing:1px;
}
.dow i{font-style:normal;}
.dow i:last-child{text-align:left;padding-left:2mm;letter-spacing:0;}

/* ========== 周行 ========== */
.week{
  display:grid;
  grid-template-columns:repeat(7,1fr) 46mm;
  gap:1.4mm;
}

/* ========== 单日 ========== */
.day{
  border:.6pt solid #d8dfe8;
  border-radius:1.4mm;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.d-head{
  flex:0 0 auto;
  display:flex;
  align-items:baseline;
  gap:1.2mm;
  padding:.9mm 1.4mm .7mm;
  border-bottom:.5pt solid #e8eef5;
}
.d-num{font-size:7.5pt;font-weight:800;letter-spacing:.2px;}
.d-dow{font-size:5.6pt;color:#a8b3c2;letter-spacing:0;}
.day .area{
  padding:0 1.4mm;
  font-size:6.5pt;
  line-height:4.3mm;
}
.day.wknd{background:#fdfaf8;}
.day.wknd .d-num{color:#c2410c;}
.day.off{background:#f4f6f9;}
.day.off .d-num{color:#b6c0cc;}
.day.off .d-dow{color:#c6cfda;}
.day.today{box-shadow:inset 0 0 0 1.5px #2b6cb0;}
.day.today .d-num{color:#2b6cb0;}

/* ========== 每周任务 ========== */
.weektask{
  border:.6pt solid #c3d4e8;
  border-radius:1.4mm;
  background:linear-gradient(180deg,#f5f9fe 0%,#fff 55%);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.w-head{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:.9mm 1.6mm .7mm;
  border-bottom:.5pt solid #dbe6f3;
  font-size:7pt;
  font-weight:800;
  color:#2b6cb0;
}
.w-head small{font-size:5.6pt;font-weight:400;color:#9fb0c4;}
.weektask .area{
  padding:0 1.6mm;
  font-size:6.5pt;
  line-height:4.3mm;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 4.1mm,
    #e3ecf6 4.1mm,
    #e3ecf6 4.3mm
  );
}

/* ========== 空状态 ========== */
.empty-tip{
  text-align:center;
  color:#94a3b8;
  font-size:14px;
  padding:60px 20px;
}

/* ========== 打印 ========== */
@page{size:A4 landscape;margin:8mm;}

@media print{
  html,body{background:#fff;}
  .noprint{display:none !important;}
  #calendar{padding:0;}
  .month-block.page{
    width:281mm;
    height:193mm;
    margin:0;
    padding:5mm 7mm;
    box-shadow:none;
    page-break-after:always;
    break-after:page;
  }
  .month-block.page:last-child{page-break-after:auto;break-after:auto;}
  .month-block.continuous{
    box-shadow:none;
    border-radius:0;
    padding:0;
    margin:0 0 10mm;
    max-width:100%;
  }
  .month-block.continuous .week{height:auto;min-height:80px;}
  .area:focus{box-shadow:none;background-color:transparent;}
  .area::-webkit-scrollbar{display:none;}
}
</style>
</head>
<body>

<!-- ========== 工具栏 ========== -->
<div class="toolbar noprint">

  <!-- 视图设置 -->
  <div class="tb-group">
    <label>起始月份
      <input type="month" id="startMonth">
    </label>
    <label>显示
      <input type="number" id="numMonths" min="1" max="24" value="1">
      个月
    </label>
    <label><input type="checkbox" id="continuous"> 连续滚动</label>
    <label><input type="checkbox" id="mergeMode"> 合并周</label>
  </div>

  <!-- 月度目标格式 -->
  <div class="tb-group">
    <span class="tb-title">月度目标</span>
    <label>背景
      <select id="monthlyBg">
        <option value="lines">横线</option>
        <option value="blank">空白</option>
      </select>
    </label>
    <label>分栏
      <select id="monthlyLayout">
        <option value="single">单栏</option>
        <option value="equal">等分</option>
        <option value="ratio">非等分</option>
      </select>
    </label>
    <label id="equalCountWrap" style="display:none">等分数
      <input type="number" id="equalCount" min="1" max="6" value="2">
    </label>
    <label id="ratioWrap" style="display:none">比例
      <input type="number" id="ratioA" min="1" max="9" value="1">:
      <input type="number" id="ratioB" min="1" max="9" value="1">
    </label>
  </div>

  <!-- 操作 -->
  <div class="tb-group">
    <button id="btnSave" class="primary">保存数据</button>
    <button id="btnClearSession">清空本次填写</button>
    <button id="btnClearAll" class="danger">清空全部</button>
    <button id="btnPrint">打印 / 导出 PDF</button>
    <span class="status" id="status"></span>
  </div>

</div>

<!-- ========== 日历容器 ========== -->
<div id="calendar"></div>

<script>
/* ============================================================
   常量
   ============================================================ */
const STORAGE_KEY = 'taskCalendar_v4';
const DOW_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];

const DEFAULT_LAYOUT = {
  mode: 'single',     // single | equal | ratio
  equalCount: 2,
  ratioA: 1,
  ratioB: 1,
  bg: 'lines',        // lines | blank
};

/* ============================================================
   状态
   ============================================================ */
const state = {
  startYear: 2026,
  startMonth: 12,
  monthsToShow: 1,
  continuous: false,
  mergeMode: false,
  data: { daily:{}, weekly:{}, monthly:{} },
  layout: Object.assign({}, DEFAULT_LAYOUT),
  savedSnapshot: null,
  dirty: false,
};

/* ============================================================
   小工具
   ============================================================ */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2,'0');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function dateKey(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function monthKey(y, m) {
  return `${y}-${pad2(m)}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function startOfWeek(d) {
  const r = new Date(d);
  r.setHours(0,0,0,0);
  const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  r.setDate(r.getDate() + diff);
  return r;
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth()
    && a.getDate() === b.getDate();
}
function fmtShort(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

/* ============================================================
   月度目标分栏配置
   ============================================================ */
function getLayoutConfig() {
  const L = state.layout;
  if (L.mode === 'equal') {
    const n = Math.max(1, Math.min(6, parseInt(L.equalCount, 10) || 2));
    return { cols: n, template: `repeat(${n}, 1fr)` };
  }
  if (L.mode === 'ratio') {
    const a = Math.max(1, Math.min(9, parseInt(L.ratioA, 10) || 1));
    const b = Math.max(1, Math.min(9, parseInt(L.ratioB, 10) || 1));
    return { cols: 2, template: `${a}fr ${b}fr` };
  }
  return { cols: 1, template: '1fr' };
}

/* ============================================================
   月度目标内容读写（支持多栏）
   ============================================================ */
function getMonthlySlot(mKey, i) {
  const v = state.data.monthly[mKey];
  if (Array.isArray(v)) return v[i] || '';
  if (typeof v === 'string') return i === 0 ? v : '';
  return '';
}
function setMonthlySlot(mKey, i, val) {
  let arr = state.data.monthly[mKey];
  if (!Array.isArray(arr)) {
    const old = arr;
    arr = [];
    if (typeof old === 'string' && old) arr[0] = old;
    state.data.monthly[mKey] = arr;
  }
  arr[i] = val;
}

/* ============================================================
   持久化
   ============================================================ */
function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return {
      daily:   d.daily   || {},
      weekly:  d.weekly  || {},
      monthly: d.monthly || {},
      layout:  Object.assign({}, DEFAULT_LAYOUT, d.layout || {}),
    };
  } catch (e) {
    return null;
  }
}

function persistData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    daily:   state.data.daily,
    weekly:  state.data.weekly,
    monthly: state.data.monthly,
    layout:  state.layout,
  }));
}

/* ============================================================
   状态提示
   ============================================================ */
function markDirty() {
  state.dirty = true;
  updateStatus();
}
function updateStatus() {
  const s = $('#status');
  if (!s) return;
  if (state.dirty) {
    s.textContent = '● 有未保存的修改';
    s.className = 'status dirty';
  } else {
    s.textContent = '✓ 已保存';
    s.className = 'status';
  }
}

/* ============================================================
   周计算
   ============================================================ */
function getMonthWeeks(year, month, mergeMode) {
  const firstDay = new Date(year, month - 1, 1);
  const lastDay  = new Date(year, month, 0);

  const start         = startOfWeek(firstDay);
  const lastWeekStart = startOfWeek(lastDay);

  const weeks = [];
  let cur = new Date(start);

  while (cur <= lastWeekStart) {
    let daysInMonth = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(cur, i);
      if (d.getFullYear() === year && d.getMonth() === month - 1) daysInMonth++;
    }
    weeks.push({ start: new Date(cur), daysInMonth });
    cur = addDays(cur, 7);
  }

  if (mergeMode) return weeks.filter(w => w.daysInMonth >= 4);
  return weeks;
}

/* ============================================================
   输入区构建
   ============================================================ */
function makeArea(value, key, type, onInput) {
  const ta = document.createElement('textarea');
  ta.className = 'area';
  ta.value = value || '';
  ta.spellcheck = false;
  ta.dataset.key = key;
  ta.dataset.type = type;

  ta.addEventListener('input', () => {
    onInput(ta.value);
    markDirty();
    syncSameKey(key, ta.value, ta);
    if (type === 'monthly') fitMonthlyHeights();
  });

  return ta;
}

/* 同一个 key 可能出现在多个月份块中，保持同步 */
function syncSameKey(key, value, excludeEl) {
  document.querySelectorAll(`[data-key="${key}"]`).forEach(ta => {
    if (ta !== excludeEl && ta.value !== value) ta.value = value;
  });
}

/* ============================================================
   动态高度：月度目标最多 3 行，最少 1 行
   ============================================================ */
function fitMonthlyHeights() {
  document.querySelectorAll('.month').forEach(box => {
    const areas = box.querySelectorAll('.month-body .area');
    if (!areas.length) return;

    let maxH = 0;

    areas.forEach(ta => {
      const cs   = getComputedStyle(ta);
      const lh   = parseFloat(cs.lineHeight) || 16;
      const padT = parseFloat(cs.paddingTop) || 0;
      const padB = parseFloat(cs.paddingBottom) || 0;

      const prevH  = ta.style.height;
      const prevOv = ta.style.overflow;

      ta.style.height   = '0px';
      ta.style.overflow = 'hidden';
      const sh = ta.scrollHeight;
      ta.style.height   = prevH;
      ta.style.overflow = prevOv;

      const textH = Math.max(0, sh - padT - padB);
      let lines = Math.round(textH / lh);
      if (!isFinite(lines) || lines < 1) lines = 1;
      if (lines > 3) lines = 3;

      const h = lines * lh + padT + padB;
      if (h > maxH) maxH = h;
    });

    areas.forEach(ta => { ta.style.height = maxH + 'px'; });
  });
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  const container = $('#calendar');
  container.innerHTML = '';

  if (state.monthsToShow < 1) {
    container.innerHTML = '<div class="empty-tip">请选择要显示的月份数量</div>';
    return;
  }

  for (let i = 0; i < state.monthsToShow; i++) {
    const d = new Date(state.startYear, state.startMonth - 1 + i, 1);
    container.appendChild(renderMonth(d.getFullYear(), d.getMonth() + 1));
  }

  fitMonthlyHeights();
  updateStatus();
}

function renderMonth(year, month) {
  const block = el('div', 'month-block ' + (state.continuous ? 'continuous' : 'page'));

  /* --- 页眉 --- */
  const hd = el('div', 'hd');
  const h1 = el('h1', null, `${year} 年 ${month} 月`);
  h1.appendChild(el('span', null, '任务日历'));
  hd.appendChild(h1);
  hd.appendChild(el('div', 'sub', '每日任务 · 每周任务 · 每月任务'));
  block.appendChild(hd);

  /* --- 月度目标（动态高度 + 分栏） --- */
  block.appendChild(renderMonthBox(year, month));

  /* --- 星期表头 --- */
  const dow = el('div', 'dow');
  DOW_NAMES.forEach(n => dow.appendChild(el('i', null, n)));
  dow.appendChild(el('i', null, '本周任务'));
  block.appendChild(dow);

  /* --- 周行 --- */
  const weeks = getMonthWeeks(year, month, state.mergeMode);
  if (weeks.length === 0) {
    block.appendChild(el('div', 'empty-tip', '本月没有符合条件的周'));
  } else {
    weeks.forEach(w => block.appendChild(renderWeek(w.start, year, month)));
  }

  return block;
}

function renderMonthBox(year, month) {
  const mKey = monthKey(year, month);
  const box  = el('div', 'month');

  const head = el('div', 'w-head');
  head.appendChild(el('span', null, '本月任务 / 月度目标'));
  head.appendChild(el('small', null, 'MONTHLY'));
  box.appendChild(head);

  const body = el('div', 'month-body');
  const cfg  = getLayoutConfig();
  body.style.gridTemplateColumns = cfg.template;

  for (let i = 0; i < cfg.cols; i++) {
    const key = `${mKey}#${i}`;
    const ta  = makeArea(
      getMonthlySlot(mKey, i),
      key,
      'monthly',
      v => setMonthlySlot(mKey, i, v)
    );
    if (state.layout.bg === 'blank') ta.classList.add('bg-blank');
    body.appendChild(ta);
  }

  box.appendChild(body);
  return box;
}

function renderWeek(weekStart, year, month) {
  const row = el('div', 'week');

  for (let i = 0; i < 7; i++) {
    row.appendChild(renderDay(addDays(weekStart, i), year, month));
  }

  /* 每周任务 */
  const wKey = dateKey(weekStart);
  const wt   = el('div', 'weektask');

  const wh = el('div', 'w-head');
  wh.appendChild(el('span', null, '本周任务'));
  wh.appendChild(el('small', null, `${fmtShort(weekStart)} – ${fmtShort(addDays(weekStart, 6))}`));
  wt.appendChild(wh);

  wt.appendChild(makeArea(
    state.data.weekly[wKey] || '',
    wKey,
    'weekly',
    v => { state.data.weekly[wKey] = v; }
  ));

  row.appendChild(wt);
  return row;
}

function renderDay(date, year, month) {
  const isOther   = date.getMonth() !== month - 1 || date.getFullYear() !== year;
  const isWeekend = date.getDay() === 0 || date.getDay() === 6;
  const isToday   = isSameDay(date, new Date());

  const cell = el('div', 'day');
  if (isWeekend) cell.classList.add('wknd');
  if (isOther)   cell.classList.add('off');
  if (isToday)   cell.classList.add('today');

  const head = el('div', 'd-head');
  head.appendChild(el('span', 'd-num', `${date.getMonth()+1}/${date.getDate()}`));
  head.appendChild(el('span', 'd-dow', DOW_NAMES[(date.getDay()+6)%7]));
  cell.appendChild(head);

  const k = dateKey(date);
  cell.appendChild(makeArea(
    state.data.daily[k] || '',
    k,
    'daily',
    v => { state.data.daily[k] = v; }
  ));

  return cell;
}

/* ============================================================
   保存 / 清空
   ============================================================ */
function snapshot() {
  return JSON.stringify({ data: state.data, layout: state.layout });
}

function doSave() {
  persistData();
  state.savedSnapshot = snapshot();
  state.dirty = false;
  updateStatus();

  const btn = $('#btnSave');
  const old = btn.textContent;
  btn.textContent = '✓ 已保存';
  setTimeout(() => { btn.textContent = old; }, 1200);
}

function clearSession() {
  if (state.dirty) {
    if (!confirm('确定要丢弃未保存的修改，恢复到上次保存的状态吗？')) return;
  }
  if (state.savedSnapshot) {
    const s = JSON.parse(state.savedSnapshot);
    state.data   = s.data;
    state.layout = s.layout;
    syncLayoutControls();
  } else {
    state.data = { daily:{}, weekly:{}, monthly:{} };
  }
  state.dirty = false;
  render();
  updateStatus();
}

function clearAll() {
  if (!confirm('确定要清空全部填写内容吗？\n\n此操作会删除浏览器中保存的所有任务数据，且不可恢复。')) return;
  state.data = { daily:{}, weekly:{}, monthly:{} };
  localStorage.removeItem(STORAGE_KEY);
  state.savedSnapshot = snapshot();
  state.dirty = false;
  render();
  updateStatus();
}

/* ============================================================
   控件同步
   ============================================================ */
function syncLayoutControls() {
  $('#monthlyBg').value     = state.layout.bg;
  $('#monthlyLayout').value = state.layout.mode;
  $('#equalCount').value    = state.layout.equalCount;
  $('#ratioA').value        = state.layout.ratioA;
  $('#ratioB').value        = state.layout.ratioB;

  $('#equalCountWrap').style.display = state.layout.mode === 'equal' ? '' : 'none';
  $('#ratioWrap').style.display      = state.layout.mode === 'ratio' ? '' : 'none';
}

/* ============================================================
   事件
   ============================================================ */
function bindEvents() {

  /* --- 起始月份 --- */
  $('#startMonth').addEventListener('change', e => {
    const v = e.target.value;
    if (!v) return;
    const [y, m] = v.split('-').map(Number);
    state.startYear  = y;
    state.startMonth = m;
    render();
  });

  /* --- 显示月数 --- */
  $('#numMonths').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 1;
    n = Math.max(1, Math.min(24, n));
    e.target.value = n;
    state.monthsToShow = n;
    render();
  });

  /* --- 连续滚动 --- */
  $('#continuous').addEventListener('change', e => {
    state.continuous = e.target.checked;
    render();
  });

  /* --- 合并周 --- */
  $('#mergeMode').addEventListener('change', e => {
    state.mergeMode = e.target.checked;
    render();
  });

  /* --- 月度目标背景 --- */
  $('#monthlyBg').addEventListener('change', e => {
    state.layout.bg = e.target.value;
    markDirty();
    render();
  });

  /* --- 月度目标分栏 --- */
  $('#monthlyLayout').addEventListener('change', e => {
    state.layout.mode = e.target.value;
    syncLayoutControls();
    markDirty();
    render();
  });

  $('#equalCount').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 2;
    n = Math.max(1, Math.min(6, n));
    e.target.value = n;
    state.layout.equalCount = n;
    markDirty();
    render();
  });

  $('#ratioA').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 1;
    n = Math.max(1, Math.min(9, n));
    e.target.value = n;
    state.layout.ratioA = n;
    markDirty();
    render();
  });

  $('#ratioB').addEventListener('change', e => {
    let n = parseInt(e.target.value, 10) || 1;
    n = Math.max(1, Math.min(9, n));
    e.target.value = n;
    state.layout.ratioB = n;
    markDirty();
    render();
  });

  /* --- 按钮 --- */
  $('#btnSave').addEventListener('click', doSave);
  $('#btnClearSession').addEventListener('click', clearSession);
  $('#btnClearAll').addEventListener('click', clearAll);
  $('#btnPrint').addEventListener('click', () => window.print());

  /* --- Ctrl / Cmd + S --- */
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      doSave();
    }
  });

  /* --- 离开前提醒 --- */
  window.addEventListener('beforeunload', e => {
    if (state.dirty) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* --- 窗口尺寸变化，重新测量月度高度 --- */
  let rzT = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(fitMonthlyHeights, 120);
  });
}

/* ============================================================
   初始化
   ============================================================ */
function init() {
  const saved = loadAll();

  if (saved) {
    state.data   = { daily: saved.daily, weekly: saved.weekly, monthly: saved.monthly };
    state.layout = saved.layout;
  }

  state.savedSnapshot = snapshot();
  state.dirty = false;

  /* 默认显示当前月 */
  const now = new Date();
  state.startYear  = now.getFullYear();
  state.startMonth = now.getMonth() + 1;
  $('#startMonth').value = `${state.startYear}-${pad2(state.startMonth)}`;
  $('#numMonths').value  = 1;

  syncLayoutControls();
  bindEvents();
  render();

  /* 字体加载完成后再次测量 */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitMonthlyHeights);
  }
  window.addEventListener('load', fitMonthlyHeights);
}

init();
</script>
</body>
</html>
